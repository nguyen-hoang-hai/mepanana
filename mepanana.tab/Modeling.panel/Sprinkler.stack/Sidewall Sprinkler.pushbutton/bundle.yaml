title: Sidewall Sprinkler
author: Hai Nguyen
tooltip: "🇺🇸 EN: Automatically connect Sidewall sprinkler heads with rigid wall drop piping to main pipes per NFPA 13 and TCVN 7336.\n\n🇻🇳 VN: Tự động kết nối đầu phun Sidewall (gắn tường) bằng ống thép luồn tường vào ống chính theo tiêu chuẩn NFPA 13 & TCVN 7336."