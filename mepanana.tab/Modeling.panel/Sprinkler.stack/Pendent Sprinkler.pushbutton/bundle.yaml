title: Pendent Sprinkler
author: Hai Nguyen
tooltip: "🇺🇸 EN: Automatically connect Pendent sprinkler heads with Riser Nipples, stepped branchlines, and safe spools per NFPA 13 and TCVN 7336.\n\n🇻🇳 VN: Tự động kết nối đầu phun Pendent (hướng xuống) với ống nhánh, côn thu và phụ kiện theo tiêu chuẩn NFPA 13 & TCVN 7336."