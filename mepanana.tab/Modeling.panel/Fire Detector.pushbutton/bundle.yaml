title: Fire Detector
author: Hai Nguyen
tooltip: "🇺🇸 EN: Auto-place fire detectors (smoke/heat) in a grid layout within a PickBox, Room, or Region zone per TCVN 5738:2021.\n\n🇻🇳 VN: Tự động bố trí đầu báo cháy (khói/nhiệt) theo lưới đều trong vùng PickBox, Room hoặc vùng khoanh vùng theo tiêu chuẩn TCVN 5738:2021."
