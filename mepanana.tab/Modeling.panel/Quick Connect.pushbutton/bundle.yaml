title: Quick Connect
tooltip: >-
  Quick Connect MEP Elements:
  Intelligently connects pipes, ducts, cable trays, and conduits (Direct, Extend, Bridge, Elbow, and Tee).

  [Click]: Enter continuous interactive connection mode (pick pairs, Esc to exit).
  [Shift-Click]: Open Quick Connect Settings (alignment tolerance, preferred connection mode).
author: Hai Nguyen
