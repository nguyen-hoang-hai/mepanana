title: MEP Route

author: Hai Nguyen
tooltip: "🇺🇸 EN: Automatically route and connect 2 parallel MEP elements (Pipes, Ducts, Cable Trays, Conduits) with custom elbow angles.\n\n🇻🇳 VN: Tự động vẽ định tuyến né chướng ngại vật cho 2 tuyến MEP song song (Ống nước, Ống gió, Thang máng cáp, Ống luồn dây) theo góc uốn tùy chọn."
